# B2B e-invoicing mandate deadlines, by country (ISO-2; EU = ViDA package).
# Verified on 2026-11-16 by the `scout` subagent. Every entry with `verified: true`
# carries a date that was read during that run on the official page in `source_url`
# (tax authority, official gazette, statute site, European Commission, GOV.UK).
# Vendor and advisory pages were not used as evidence.
#
# binds: buyer_directly = a large buyer itself must comply; suppliers_of_buyer = the obligation falls on
# its small suppliers (an onboarding angle, weaker trigger); member_states = not a company obligation (never a trigger).
#
# RULE: only entries with `verified: true` AND a non-null `date` may be used as triggers.
# The trigger model uses: verified true, status upcoming, date within the next 18 months,
# matched to accounts by HQ country. Entries with `verified: false` are recorded for
# completeness only and must not be used.
#
# Caveat on reading method: pages were read through a fetch tool that summarises the page,
# so the `text` sentences are plain-language paraphrases, not statutory wording.
# Re-check the source_url before quoting a date to a customer; these dates have moved before.

mandates:

  # ---------------- Germany ----------------
  - country: DE
    date: 2025-01-01
    applies_to: "Domestic B2B supplies between businesses established in Germany (supplies made after 31 December 2024)"
    binds: buyer_directly
    text: "Since 1 January 2025 the German e-invoice rules apply to domestic B2B supplies, with transitional relief on issuing that runs out at the end of 2026 and 2027."
    status: in_force
    verified: true
    source_url: "https://www.gesetze-im-internet.de/ustg_1980/__27.html"
    source_name: "Umsatzsteuergesetz (UStG) § 27 Abs. 38, gesetze-im-internet.de (Federal Ministry of Justice)"
    verified_at: 2026-11-16
    notes: "Read: § 27 Abs. 38 Nr. 1 allows paper or other electronic formats (with recipient consent) until 31 Dec 2026 for supplies made after 31 Dec 2024 and before 1 Jan 2027. The start date is taken from that wording. The separate point that every business must be able to RECEIVE e-invoices from 1 Jan 2025 was NOT read on an official page in this run: the BMF FAQ (bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html) returned HTTP 503 three times."

  - country: DE
    date: 2027-01-01
    applies_to: "Invoice issuers whose total turnover in the previous calendar year exceeded EUR 800,000 (domestic B2B supplies)"
    binds: buyer_directly
    text: "From 1 January 2027, German businesses with prior-year turnover above EUR 800,000 must issue structured e-invoices for domestic B2B supplies; paper and PDF are no longer allowed for them."
    status: upcoming
    verified: true
    source_url: "https://www.gesetze-im-internet.de/ustg_1980/__27.html"
    source_name: "Umsatzsteuergesetz (UStG) § 27 Abs. 38, gesetze-im-internet.de"
    verified_at: 2026-11-16
    notes: "Read: Nr. 1 transitional relief for all issuers ends 31 Dec 2026. Nr. 2 extends relief to 31 Dec 2027 only where the issuer's Gesamtumsatz (§ 19 Abs. 2) in the previous calendar year was not more than EUR 800,000. Nr. 3 keeps EDI (Recommendation 94/820/EC) allowed until 31 Dec 2027 with recipient consent. So a large issuer using EDI is still covered by Nr. 3 during 2027. The 2027-01-01 date is the day after the end date stated in the statute."

  - country: DE
    date: 2028-01-01
    applies_to: "All remaining issuers (prior-year turnover up to EUR 800,000) and invoices sent by EDI that do not meet the e-invoice format"
    binds: suppliers_of_buyer
    text: "From 1 January 2028 all German businesses must issue structured e-invoices for domestic B2B supplies, and the transitional allowance for non-compliant EDI ends."
    status: upcoming
    verified: true
    source_url: "https://www.gesetze-im-internet.de/ustg_1980/__27.html"
    source_name: "Umsatzsteuergesetz (UStG) § 27 Abs. 38, gesetze-im-internet.de"
    verified_at: 2026-11-16
    notes: "Read: Nr. 2 and Nr. 3 relief both end 31 Dec 2027. The 2028-01-01 date is the day after. For a large buyer this is the date its small suppliers must send structured invoices."

  # ---------------- France ----------------
  - country: FR
    date: 2026-09-01
    applies_to: "All companies must be able to receive e-invoices; large companies (grandes entreprises) and mid-caps (ETI) must issue them; e-reporting follows the same calendar"
    binds: buyer_directly
    text: "Since 1 September 2026 every French company must be able to receive e-invoices, and large companies and ETIs must issue all their B2B invoices electronically."
    status: in_force
    verified: true
    source_url: "https://www.impots.gouv.fr/professionnel/je-decouvre-la-facturation-electronique"
    source_name: "impots.gouv.fr (DGFiP), 'Je découvre la facturation électronique', page modified 26/05/2026"
    verified_at: 2026-11-16
    notes: "The page (last modified 26 May 2026) states the dates in the future tense. status in_force is inferred because the date has passed; no official page read in this run announced a further postponement, but none was read that was published after 1 Sept 2026 either. economie.gouv.fr returned HTTP 403, so a reported no-penalty tolerance for the rest of 2026 is NOT verified."

  - country: FR
    date: 2027-09-01
    applies_to: "Small and medium-sized companies (PME) and micro-enterprises: issuing obligation and e-reporting"
    binds: suppliers_of_buyer
    text: "By 1 September 2027 French SMEs and micro-enterprises must issue their B2B invoices electronically, which means a large French buyer's whole supplier base goes structured."
    status: upcoming
    verified: true
    source_url: "https://www.impots.gouv.fr/professionnel/je-decouvre-la-facturation-electronique"
    source_name: "impots.gouv.fr (DGFiP), 'Je découvre la facturation électronique', page modified 26/05/2026"
    verified_at: 2026-11-16
    notes: "Read: small and micro-enterprises 'auront jusqu'au 1er septembre 2027 pour émettre électroniquement leurs factures'; e-reporting 'suit le même calendrier'. For Global 2000-size accounts this is a supplier-side trigger, not a direct obligation on the buyer (the buyer's own issuing duty started 1 Sept 2026)."

  # ---------------- Spain ----------------
  - country: ES
    date: 2026-10-06
    applies_to: "Start of the legal clock for all businesses and professionals (entry into force of Orden HAC/1028/2026)"
    binds: buyer_directly
    text: "On 6 October 2026 the ministerial order on Spain's public e-invoicing solution entered into force, which started the 12 and 24 month countdown to mandatory B2B e-invoicing."
    status: in_force
    verified: true
    source_url: "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20587"
    source_name: "Orden HAC/1028/2026, de 2 de octubre, BOE núm. 247 de 5 de octubre de 2026 (BOE-A-2026-20587)"
    verified_at: 2026-11-16
    notes: "Read on BOE: published 5 Oct 2026, 'entrará en vigor el día siguiente al de su publicación'; preamble says its entry into force starts the periods of Ley 18/2022 disposición final octava and RD 238/2026. Real Decreto 238/2026 (BOE-A-2026-7295, published 31 Mar 2026, in force 20 Apr 2026) disposición final cuarta sets 12 months for turnover above EUR 8M and 24 months for the rest, counted from this order. This is a milestone, not an obligation date."

  - country: ES
    date: 2027-10-06
    applies_to: "Businesses and professionals with VAT turnover above EUR 8 million in the previous calendar year: issue and receive e-invoices, and report invoice status and payment"
    binds: buyer_directly
    text: "From 6 October 2027, Spanish companies with turnover above EUR 8 million must issue and receive B2B e-invoices and report invoice status, including when each invoice is actually paid."
    status: upcoming
    verified: true
    source_url: "https://sede.agenciatributaria.gob.es/Sede/iva/factura-electronica/calendario-implantacion.html"
    source_name: "Agencia Tributaria, 'Calendario de implantación' (factura electrónica)"
    verified_at: 2026-11-16
    notes: "Read: 'A los 12 meses (6 de octubre de 2027), para grandes empresarios y profesionales'. Status and payment reporting applies to this group from the same date. For 12 months from that date they must attach a readable PDF to each e-invoice unless the recipient accepts the original format (RD 238/2026 disposición transitoria segunda). Private exchange platform obligations also apply from 6 Oct 2027. The payment-status reporting is directly relevant to a late-payment pitch: Ley 18/2022 ties the mandate to fighting late payment."

  - country: ES
    date: 2028-10-06
    applies_to: "All other businesses and professionals: issue and receive e-invoices; legal entities among them also report invoice status"
    binds: suppliers_of_buyer
    text: "From 6 October 2028 every remaining Spanish business must issue and receive B2B e-invoices."
    status: upcoming
    verified: true
    source_url: "https://sede.agenciatributaria.gob.es/Sede/iva/factura-electronica/calendario-implantacion.html"
    source_name: "Agencia Tributaria, 'Calendario de implantación' (factura electrónica)"
    verified_at: 2026-11-16
    notes: "Read: 'A los 24 meses (6 de octubre de 2028), para el resto de empresarios y profesionales.' Outside the 18-month trigger window as of 2026-11-16."

  - country: ES
    date: 2029-10-06
    applies_to: "Individuals and income-attribution entities with turnover at or below EUR 8 million: invoice status reporting"
    binds: suppliers_of_buyer
    text: "From 6 October 2029 the invoice status reporting duty also covers Spanish sole traders and income-attribution entities."
    status: upcoming
    verified: true
    source_url: "https://sede.agenciatributaria.gob.es/Sede/iva/factura-electronica/calendario-implantacion.html"
    source_name: "Agencia Tributaria, 'Calendario de implantación' (factura electrónica)"
    verified_at: 2026-11-16
    notes: "Read: 'A los 36 meses (6 de octubre de 2029)'. Not relevant to enterprise accounts; recorded for completeness."

  # ---------------- United Kingdom ----------------
  - country: GB
    date: 2029-04-01
    applies_to: "VAT-registered persons, public and private sector, must be able to issue and receive VAT invoices as e-invoices where the customer is also VAT-registered; limited exemptions expected; no phasing by size described"
    binds: buyer_directly
    text: "The UK government plans to require all VAT-registered businesses to issue and receive VAT invoices as e-invoices from 1 April 2029."
    status: proposed
    verified: true
    source_url: "https://www.gov.uk/government/publications/e-invoicing-implementation-roadmap/roadmap-for-e-invoicing-implementation"
    source_name: "GOV.UK, 'Roadmap for e-invoicing implementation', published 28 October 2026"
    verified_at: 2026-11-16
    notes: "Status proposed, not upcoming, because the law is not enacted: the roadmap says primary legislation will be introduced in Finance Bill 2026 and is expected to become law in Spring 2027; secondary legislation may not conclude until Autumn 2028 or early 2029. Other roadmap milestones read: consultation on standards Spring 2027; requirements confirmed between October 2027 and April 2028; updated VAT guidance by April 2028; readiness testing with software providers Summer 2028. Outside the 18-month trigger window."

  # ---------------- Belgium ----------------
  - country: BE
    date: 2026-01-01
    applies_to: "All Belgian enterprises liable to VAT, for invoices between each other (issue and receive); invoices to private individuals are out of scope"
    binds: buyer_directly
    text: "Since 1 January 2026 all Belgian VAT-liable businesses must use structured electronic invoices with each other."
    status: in_force
    verified: true
    source_url: "https://einvoice.belgium.be/en/article/structured-electronic-invoices-between-companies-are-compulsory-2026"
    source_name: "einvoice.belgium.be (Belgian federal government e-invoicing site)"
    verified_at: 2026-11-16
    notes: "The FPS Finance page (finance.belgium.be) served a human-verification challenge and was not read. The federal einvoice.belgium.be site was read instead. A news item there dated 18/12/2025 says FPS Finance 'will show tolerance during the first three months of 2026' for firms that can show timely, reasonable steps, with no general postponement. That tolerance has ended."

  - country: BE
    date: null
    applies_to: "Belgian VAT-liable businesses (near-real-time e-reporting, reported elsewhere as planned for 2028)"
    binds: buyer_directly
    text: "Not usable: a Belgian e-reporting date was not confirmed on an official source."
    status: proposed
    verified: false
    source_url: "https://einvoice.belgium.be/en/article/structured-electronic-invoices-between-companies-are-compulsory-2026"
    source_name: "einvoice.belgium.be (page read; it does not mention e-reporting)"
    verified_at: 2026-11-16
    notes: "The official page read does not mention a 2028 e-reporting step. It only says that 'as from 2030' the obligation will also apply to invoicing between EU Member States (see the EU entry). Do not use."

  # ---------------- Poland ----------------
  - country: PL
    date: 2026-02-01
    applies_to: "Companies whose 2024 sales exceeded PLN 200 million (including VAT): issuing in KSeF; KSeF 2.0 also opens for invoice recipients"
    binds: buyer_directly
    text: "Since 1 February 2026, Polish companies with 2024 sales above PLN 200 million must issue invoices through the national KSeF system."
    status: in_force
    verified: true
    source_url: "https://ksef.podatki.gov.pl/od-kiedy-trzeba-wystawiac-faktury-w-ksef/"
    source_name: "ksef.podatki.gov.pl (Polish Ministry of Finance), 'Od kiedy trzeba wystawiać faktury w KSeF?', modified 30.04.2026"
    verified_at: 2026-11-16
    notes: "Read: 'od 1 lutego 2026 r. dla firm, które w 2024 r. miały sprzedaż powyżej 200 mln zł (z VAT)'. The stages page (etapy-wdrozenia-ksef, modified 29.05.2026) describes 1 Feb 2026 as KSeF 2.0 for large businesses and for those receiving invoices."

  - country: PL
    date: 2026-04-01
    applies_to: "All other businesses, except the smallest (invoiced sales up to PLN 10,000 per month)"
    binds: suppliers_of_buyer
    text: "Since 1 April 2026 KSeF e-invoicing is mandatory for all other Polish businesses except the very smallest."
    status: in_force
    verified: true
    source_url: "https://ksef.podatki.gov.pl/od-kiedy-trzeba-wystawiac-faktury-w-ksef/"
    source_name: "ksef.podatki.gov.pl (Polish Ministry of Finance), modified 30.04.2026"
    verified_at: 2026-11-16
    notes: "Read: 'od 1 kwietnia 2026 r. dla pozostałych'."

  - country: PL
    date: 2027-01-01
    applies_to: "The smallest businesses previously exempt (invoiced sales including VAT up to PLN 10,000 per month)"
    binds: suppliers_of_buyer
    text: "From 1 January 2027 KSeF e-invoicing is mandatory for every Polish business, including the smallest firms that were exempt until then."
    status: upcoming
    verified: true
    source_url: "https://ksef.podatki.gov.pl/etapy-wdrozenia-ksef/"
    source_name: "ksef.podatki.gov.pl (Polish Ministry of Finance), 'Etapy wdrożenia KSeF', modified 29.05.2026"
    verified_at: 2026-11-16
    notes: "Read: heading 'KSeF obowiązkowy dla wszystkich' for 1 stycznia 2027 r.; the other page says invoices outside KSeF are allowed until 31 Dec 2026 if the monthly total does not exceed PLN 10,000. For enterprise accounts this is a supplier long-tail trigger only."

  - country: PL
    date: null
    applies_to: "KSeF penalties"
    binds: buyer_directly
    text: "Not usable: the start date of KSeF penalties was not confirmed on an official source."
    status: upcoming
    verified: false
    source_url: "https://ksef.podatki.gov.pl/etapy-wdrozenia-ksef/"
    source_name: "ksef.podatki.gov.pl (pages read; neither mentions penalties)"
    verified_at: 2026-11-16
    notes: "Neither official page read states when penalties start. Do not use."

  # ---------------- Italy ----------------
  - country: IT
    date: 2019-01-01
    applies_to: "All invoices between parties resident or established in Italy, B2B and B2C, through the Sistema di Interscambio (SdI)"
    binds: buyer_directly
    text: "Italy has required e-invoicing through the state exchange system for domestic B2B and B2C invoices since 1 January 2019."
    status: in_force
    verified: true
    source_url: "https://www.agenziaentrate.gov.it/portale/aree-tematiche/fatturazione-elettronica/guida-fatturazione-elettronica/la-fattura-elettronica"
    source_name: "Agenzia delle Entrate, 'La fattura elettronica'"
    verified_at: 2026-11-16
    notes: "The same page says invoices to the public administration were already mandatory from 31 March 2015. No upcoming Italian deadline was found, so Italy produces no dated trigger."

  - country: IT
    date: null
    applies_to: "Flat-rate (forfettari) taxpayers"
    binds: suppliers_of_buyer
    text: "Not usable: the extension of Italian e-invoicing to flat-rate taxpayers was not confirmed on a page opened in this run."
    status: in_force
    verified: false
    source_url: "https://www.agenziaentrate.gov.it/portale/aree-tematiche/fatturazione-elettronica/guida-fatturazione-elettronica/la-fattura-elettronica"
    source_name: "Agenzia delle Entrate (page read; it does not mention forfettari)"
    verified_at: 2026-11-16
    notes: "Search snippets from agenziaentrate.gov.it documents point to 1 July 2022 (above EUR 25,000) and 1 January 2024 (all), but those documents were not opened. Irrelevant for enterprise accounts. Do not use."

  # ---------------- EU: VAT in the Digital Age (ViDA) ----------------
  - country: EU
    date: 2025-04-14
    applies_to: "EU Member States (power to introduce mandatory domestic e-invoicing under specific conditions)"
    binds: member_states
    text: "The EU's ViDA package entered into force on 14 April 2025, and since then Member States can introduce mandatory e-invoicing."
    status: in_force
    verified: true
    source_url: "https://taxation-customs.ec.europa.eu/taxation/vat/vat-digital-age-vida_en"
    source_name: "European Commission, DG TAXUD, 'VAT in the Digital Age (ViDA)'"
    verified_at: 2026-11-16
    notes: "Read: adopted 11 March 2025, published in the Official Journal (L series) 25 March 2025, 'Upon entry into force (14 April 2025), Member States are able to introduce mandatory e-invoicing' under specific conditions."

  - country: EU
    date: 2030-07-01
    applies_to: "Cross-border B2B transactions within the EU (Digital Reporting Requirements, based on e-invoicing)"
    binds: buyer_directly
    text: "From 1 July 2030, EU digital reporting requirements based on e-invoicing apply to cross-border B2B transactions."
    status: upcoming
    verified: true
    source_url: "https://taxation-customs.ec.europa.eu/taxation/vat/vat-digital-age-vida_en"
    source_name: "European Commission, DG TAXUD, 'VAT in the Digital Age (ViDA)'"
    verified_at: 2026-11-16
    notes: "Read: 'Digital Reporting Requirements will affect cross-border B2B transactions from 1 July 2030.' The Commission page describes the reporting as based on e-invoicing; it does not use the words 'mandatory e-invoicing' for this date, so the text here stays with the page's wording. Outside the 18-month trigger window."

  - country: EU
    date: 2035-01-01
    applies_to: "Member States with a domestic digital real-time transaction reporting obligation (must align with the EU system)"
    binds: member_states
    text: "By 1 January 2035, EU countries with their own real-time invoice reporting must align it with the EU system."
    status: upcoming
    verified: true
    source_url: "https://taxation-customs.ec.europa.eu/taxation/vat/vat-digital-age-vida_en"
    source_name: "European Commission, DG TAXUD, 'VAT in the Digital Age (ViDA)'"
    verified_at: 2026-11-16
    notes: "Outside the 18-month trigger window. Other ViDA dates on the page (1 Jan 2027 OSS/IOSS clarifications, 1 July 2028 platform deemed-supplier rules, deferrable to 1 Jan 2030) are not about B2B e-invoicing and are left out."
