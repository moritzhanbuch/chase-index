[project]
name = "chase-index"
version = "0.2.0"
description = "The Chase Index: source-traceable dataset on how fast large companies pay suppliers"
requires-python = ">=3.11"
license = "MIT"
# Runtime needs of the read-only surfaces (query layer, MCP server, /chase-brief skill, workflow API).
# The full build pipeline (scrapers, PDF readers, site, screenshots) uses requirements.txt or the `build` extra.
dependencies = [
  "pandas>=2.2", "pyarrow>=16", "pyyaml>=6", "numpy", "rapidfuzz>=3.9", "httpx>=0.27",
  "python-dotenv>=1.0", "mcp>=2.0", "jinja2>=3.1", "markdown>=3.6",
]

[project.optional-dependencies]
build = ["duckdb>=1.0", "pdfplumber>=0.11", "pymupdf>=1.24", "pydantic>=2.7", "lxml>=5",
         "beautifulsoup4>=4.12", "playwright>=1.45", "pytest>=8"]

[project.scripts]
chase-index-mcp = "chase.mcp_entry:main"
chase-brief = "chase.brief_entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
