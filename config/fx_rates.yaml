# Rough FX rates: USD per 1 unit of currency (ISO 4217 code).
# ASSUMPTION, not sourced data: approximate round-number levels (roughly 2024-2025 averages), typed by hand.
# Used only for coarse size screening (e.g. "revenue >= ~USD 3B") of Wikidata revenue figures,
# which themselves refer to different years. Never use these to publish a converted figure as fact:
# always keep and show the original amount + currency + year.
# One current rate is applied to all years (no historical FX), so old figures in currencies that
# devalued strongly (TRY, ARS, RUB, NGN, EGP) are understated in USD terms.
# Legacy pre-euro currencies use their fixed euro conversion rate x the EUR rate below.
