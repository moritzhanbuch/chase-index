# Internal GTM workspace -> GitHub Pages.
# DO NOT RUN until Mo has reviewed the workspace. It contains internal scoring and draft openers.
# Manual trigger only (workflow_dispatch). No secrets are needed: the build reads data/processed/ only.
# Note: data/processed/ must be present in the repo for this build to work, and the Pages site should be private
# (GitHub Enterprise access control) or protected another way. Every page already carries noindex.
name: workspace-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workspace-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e .
      - name: Build workspace
        run: make workspace
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workspace/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
